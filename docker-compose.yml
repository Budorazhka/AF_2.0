services:
  web:
    build: .
    image: aurum-club-web
    container_name: aurum_club_web
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8090}:80"
    # медиа можно монтировать без пересборки образа:
    volumes:
      - ./assets:/usr/share/nginx/html/assets:ro
    depends_on:
      - api

  api:
    image: python:3.11-alpine
    container_name: aurum_club_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app:ro
    env_file: .env
    command: python -u api/server.py
