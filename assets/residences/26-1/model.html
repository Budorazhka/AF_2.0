function draw(){let d=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.depthMask(true);gl.clearColor(.929,.925,.906,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let aspect=w/h,sy=2/zoom,sx=sy/aspect;if(aspect<1){sx=2/(zoom*1.06);sy=sx*aspect}let cy=Math.cos(yaw),sn=Math.sin(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch);let right=[cy,0,-sn],up=[-sn*sp,cp,-cy*sp],depth=[-sn*cp,-sp,-cy*cp];let dot=(a,b)=>a.reduce((s,q,j)=>s+q*b[j],0);let m=[right[0]*sx,up[0]*sy,depth[0]/25,0,right[1]*sx,up[1]*sy,depth[1]/25,0,right[2]*sx,up[2]*sy,depth[2]/25,0,-dot(right,center)*sx,-dot(up,center)*sy,-dot(depth,center)/25,1];gl.uniformMatrix4fv(locM,false,new Float32Array(m));let ordered=[...data].sort((a,b)=>{if(!a.alpha&&!b.alpha)return 0;if(!a.alpha)return -1;if(!b.alpha)return 1;let z=o=>o.v.reduce((s,v)=>s+dot(depth,v),0)/o.v.length;return z(b)-z(a)});for(let o of ordered){if(!facade&&o.group==='facade')continue;if(!furniture&&o.group==='furniture')continue;let b=cut?o.cut:o.full;gl.bindBuffer(gl.ARRAY_BUFFER,b.pb);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,b.nb);gl.vertexAttribPointer(locN,3,gl.FLOAT,false,0,0);gl.uniform3fv(locC,o.rgb);gl.uniform1f(locA,o.alpha||1);if(o.alpha){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false)}else{gl.disable(gl.BLEND);gl.depthMask(true)}gl.drawArrays(gl.TRIANGLES,0,b.count)}}
const points=new Map();canvas.onpointerdown=e=>{points.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=canvas.onpointercancel=e=>points.delete(e.pointerId);canvas.onpointermove=e=>{let old=points.get(e.pointerId);if(!old)return;if(points.size===2){let other=[...points.entries()].find(([i])=>i!==e.pointerId)[1];let before=Math.hypot(old[0]-other[0],old[1]-other[1]);let after=Math.hypot(e.clientX-other[0],e.clientY-other[1]);zoom=Math.max(5,Math.min(30,zoom*before/Math.max(after,1)))}else{yaw+=(e.clientX-old[0])*.007;pitch=Math.max(.12,Math.min(Math.PI/2,pitch+(e.clientY-old[1])*.007))}points.set(e.pointerId,[e.clientX,e.clientY]);draw()};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(5,Math.min(30,zoom*Math.exp(e.deltaY*.001)));draw()};
document.getElementById('iso').onclick=()=>{yaw=-.45;pitch=.9;zoom=defaultZoom;document.getElementById('iso').classList.add('active');document.getElementById('top').classList.remove('active');draw()};document.getElementById('top').onclick=()=>{yaw=0;pitch=Math.PI/2;zoom=defaultZoom;document.getElementById('top').classList.add('active');document.getElementById('iso').classList.remove('active');draw()};document.getElementById('walls').onclick=e=>{cut=!cut;e.target.classList.toggle('active',cut);draw()};document.getElementById('furniture').onclick=e=>{furniture=!furniture;e.target.classList.toggle('active',furniture);draw()};document.getElementById('facade').onclick=e=>{facade=!facade;e.target.classList.toggle('active',facade);draw()};window.onresize=draw;draw();window.modelStats={objects:data.length,webgl:gl.getError()};
</script></html>
